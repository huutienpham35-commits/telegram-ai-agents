workflows:
  telegram-ios-build:
    name: Build Telegram iOS (AI Agent)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        TELEGRAM_COMMIT: "fb0e62b"
    scripts:
      - name: Install dependencies
        script: |
          brew install bazelisk cmake ninja
      - name: Clone Telegram-iOS and apply patch
        script: |
          git clone --recursive https://github.com/TelegramMessenger/Telegram-iOS.git /tmp/Telegram-iOS
          cd /tmp/Telegram-iOS
          git checkout $TELEGRAM_COMMIT
          git submodule update --init --recursive
          git apply $CM_BUILD_DIR/changes.patch
      - name: Setup build configuration
        script: |
          cd /tmp/Telegram-iOS
          cat << 'CONF' > build-system/minimal-build-configuration.json
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "8",
            "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          CONF
      - name: Build IPA via Bazel
        script: |
          cd /tmp/Telegram-iOS
          mkdir -p $CM_BUILD_DIR/artifacts
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/minimal-build-configuration.json \
            --xcodeManagedCodesigning \
            --configuration=release_arm64 \
            --buildNumber=10000 \
            --outputBuildArtifactsPath=$CM_BUILD_DIR/artifacts
    artifacts:
      - artifacts/*.ipa
      - artifacts/*.app
      - artifacts/*.zip
